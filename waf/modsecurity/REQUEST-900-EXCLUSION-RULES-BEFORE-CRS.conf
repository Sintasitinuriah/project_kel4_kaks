# ==============================================================================
# OWASP CRS - Custom Before-CRS Configuration
# Defense-in-Depth Layer 2: WAF (Nginx + ModSecurity v3 + OWASP CRS)
# ==============================================================================
#
# Catatan Arsitektur:
# - Mode WAF dikontrol melalui environment variable MODSEC_RULE_ENGINE di .env:
#     * On            -> Blocking Mode (mengembalikan HTTP 403 Forbidden pada SQLi)
#     * DetectionOnly -> Detection Mode (meneruskan trafik, mencatat alert ke audit.log)
#     * Off           -> Bypass Mode (nonaktif, untuk baseline pengujian Layer 3 & 4)
#
# - Seluruh aturan OWASP CRS untuk SQL Injection (seri 942xxx) tetap aktif penuh
#   pada seluruh endpoint (/vulnerable/* dan /secure/*).
#
# - Pengecualian minimal hanya diterapkan pada endpoint internal healthcheck
#   agar Docker healthcheck tidak memicu noise log audit.

SecRule REQUEST_URI "@streq /health" \
    "id:9001001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off"
